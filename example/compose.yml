services:
  claude-code:
    image: dgshue/claude-container:latest
    container_name: claude-code
    restart: unless-stopped
    environment:
      CLAUDE_CONFIG_DIR: /claude
      SSH_USER: ${SSH_USER:-claude}
      SSH_PASSWORD: ${SSH_PASSWORD:?Set SSH_PASSWORD in .env}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      # ── MCP Server Configuration ──────────────────────────────────
      # Option 1: Mount a JSON file (see mcp-servers.json.example)
      # MCP_SERVERS_FILE: /mcp/servers.json

      # Option 2: Inline JSON (for simple setups)
      # MCP_SERVERS: |
      #   {
      #     "memory": {
      #       "command": "npx",
      #       "args": ["-y", "@anthropic-ai/claude-code-mcp-server-memory"]
      #     }
      #   }

      # Set to "true" to overwrite existing settings.json on restart
      # MCP_FORCE_CONFIG: "false"

    volumes:
      - ./data/workspace:/workspace
      - ./data/claude-config:/claude
      - ./data/home:/home/claude
      - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment to mount MCP server config file
      # - ./mcp-servers.json:/mcp/servers.json:ro
    ports:
      - "2222:22"

  # Optional: browser-based SSH access via WebSSH2
  # Uncomment the section below to enable web terminal access
  #
  # webssh2:
  #   image: billchurch/webssh2:latest
  #   container_name: webssh2
  #   restart: unless-stopped
  #   ports:
  #     - "8080:2222"
  #   # Connect to claude-code via the default Docker bridge network
  #   # Open http://localhost:8080/ssh/host/claude-code in your browser
